# Render Blueprint: API + web app from the Dockerfile at https://ecampus-mmu.onrender.com
#
# Free plan: no persistent disk and the service sleeps when idle, so the SQLite
# database resets on every restart (demo data is reloaded automatically).
# For real use switch to `plan: starter` and add a disk, e.g.:
#   disk:
#     name: ecampus-data
#     mountPath: /data
#     sizeGB: 1
services:
  - type: web
    name: ecampus-mmu
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Loads the demo university into an empty database (used by app-store reviewers).
      - key: SEED_DEMO
        value: "true"
      - key: APP_NAME
        value: eCampus MMU
      # Public contact shown on /privacy and /account-deletion (same as the Play listing).
      - key: SUPPORT_EMAIL
        value: samuel.ocen@mmu.ac.ug
